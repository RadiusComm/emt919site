[build]
  publish = "."

[[redirects]]
  from = "/pricing"
  to = "/service-options"
  status = 301

[[redirects]]
  from = "/pricing.html"
  to = "/service-options"
  status = 301

[[headers]]
  for = "/styles.*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
